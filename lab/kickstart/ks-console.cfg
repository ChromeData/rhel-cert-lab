# Kickstart - RHCSA exam console
#
# Mirrors the real exam layout: a graphical live environment (Firefox showing the exam
# paper + terminal windows) that is SEPARATE from the systems under test. Nothing on
# this VM is graded - node1 and node2 are the machines you configure.

text
eula --agreed
lang en_US.UTF-8
keyboard us
timezone America/New_York --utc

rootpw --plaintext Rhcsa!2026
user --name=exam --password=Rhcsa!2026 --plaintext --gecos="Exam Candidate" --groups=wheel

network --bootproto=dhcp --device=link --activate --onboot=yes
network --hostname=console.exam.example.com

ignoredisk --only-use=sda
clearpart --all --initlabel --drives=sda
autopart --type=lvm
bootloader --boot-drive=sda

firstboot --disable
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd

# Boot straight to the graphical desktop, like the exam live environment.
xconfig --startxonboot

cdrom

%packages
@^graphical-server-environment
firefox
gnome-terminal
openssh-clients
nautilus
%end

%post --log=/root/ks-post.log
mkdir -p /etc/ssh/sshd_config.d
echo 'PermitRootLogin yes' > /etc/ssh/sshd_config.d/99-rhcsa-lab.conf
mkdir -p /root/.ssh && chmod 700 /root/.ssh
echo '@@SSHKEY@@' > /root/.ssh/authorized_keys
chmod 600 /root/.ssh/authorized_keys

# --- boot straight into the desktop, no login prompt (exam-like) ---
systemctl set-default graphical.target
mkdir -p /etc/gdm
cat > /etc/gdm/custom.conf <<'EOF'
[daemon]
AutomaticLoginEnable=True
AutomaticLogin=exam
WaylandEnable=false

[security]

[xdmcp]

[chooser]

[debug]
EOF

# --- host-only interface = 192.168.56.100 (second ethernet device) ---
DEV=$(ls /sys/class/net 2>/dev/null | grep -E '^(en|eth)' | sort | sed -n 2p)
if [ -n "$DEV" ]; then
  cat > /etc/NetworkManager/system-connections/hostonly.nmconnection <<EOF
[connection]
id=hostonly
type=ethernet
interface-name=$DEV
autoconnect=true

[ipv4]
method=manual
address1=192.168.56.100/24

[ipv6]
method=disabled
EOF
  chmod 600 /etc/NetworkManager/system-connections/hostonly.nmconnection
fi

# --- known hosts / convenience for the exam user ---
mkdir -p /home/exam/.ssh && chmod 700 /home/exam/.ssh
cat > /home/exam/.ssh/config <<'EOF'
Host node1
    HostName 192.168.56.101
    User root
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null

Host node2
    HostName 192.168.56.102
    User root
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
EOF
chmod 600 /home/exam/.ssh/config
chown -R exam:exam /home/exam/.ssh

cat >> /home/exam/.bashrc <<'EOF'

# RHCSA exam console
alias node1='ssh node1'
alias node2='ssh node2'
PS1='[\u@console \W]\$ '
EOF
chown exam:exam /home/exam/.bashrc

# Placeholder - the real exam paper is copied in after install.
echo '<h1>Exam paper not yet deployed</h1>' > /home/exam/exam.html
chown exam:exam /home/exam/exam.html
%end

poweroff
