# Kickstart - RHCSA lab node2 (Rocky Linux 10)
# node2 exists purely as a second host to test firewall rules and services FROM.
# Unlike node1, its host-only interface IS pre-configured (192.168.56.102) because
# nothing on node2 is graded.

text
eula --agreed
lang en_US.UTF-8
keyboard us
timezone America/New_York --utc

rootpw --plaintext Rhcsa!2026

network --bootproto=dhcp --device=link --activate --onboot=yes
network --hostname=node2.domain40.example.com

ignoredisk --only-use=sda
clearpart --all --initlabel --drives=sda
autopart --type=lvm
bootloader --boot-drive=sda

firstboot --disable
skipx
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,chronyd

cdrom

%packages
@^minimal-environment
openssh-server
curl
chrony
bash-completion
%end

%post --log=/root/ks-post.log
mkdir -p /etc/ssh/sshd_config.d
echo 'PermitRootLogin yes' > /etc/ssh/sshd_config.d/99-rhcsa-lab.conf

# Host's lab key, substituted in at ISO-build time by 02-install-os.ps1
mkdir -p /root/.ssh && chmod 700 /root/.ssh
echo '@@SSHKEY@@' > /root/.ssh/authorized_keys
chmod 600 /root/.ssh/authorized_keys

# Pre-configure the host-only interface as 192.168.56.102.
# The host-only NIC is the SECOND ethernet device (NAT is first, PCI slot order).
DEV=$(ls /sys/class/net 2>/dev/null | grep -E '^(en|eth)' | sort | sed -n 2p)
if [ -n "$DEV" ]; then
  cat > /etc/NetworkManager/system-connections/hostonly.nmconnection <<EOF
[connection]
id=hostonly
type=ethernet
interface-name=$DEV
autoconnect=true

[ipv4]
method=manual
address1=192.168.56.102/24

[ipv6]
method=disabled
EOF
  chmod 600 /etc/NetworkManager/system-connections/hostonly.nmconnection
  echo "configured $DEV as 192.168.56.102" >> /root/ks-post.log
else
  echo "WARNING: could not identify second ethernet device" >> /root/ks-post.log
fi

cat > /etc/motd <<'EOF'

  RHCSA practice lab - node2  (192.168.56.102)
  --------------------------------------------
  This box is your TEST CLIENT. Use it to prove node1's services
  actually work from outside:

    curl http://192.168.56.101/
    curl ftp://192.168.56.101/pub/README

  A service that answers on localhost but not from here = zero points.

EOF
%end

poweroff
