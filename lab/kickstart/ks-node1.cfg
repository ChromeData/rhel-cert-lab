# Kickstart - RHCSA lab node1 (Rocky Linux 10)
# Delivered on a volume labelled OEMDRV, which Anaconda auto-detects. Zero interaction.

text
eula --agreed
lang en_US.UTF-8
keyboard us
timezone America/New_York --utc

# Lab credentials - documented in README.md
rootpw --plaintext Rhcsa!2026

# NAT interface comes up on DHCP so dnf works.
# The host-only interface is deliberately LEFT UNCONFIGURED - configuring it is task T01.
network --bootproto=dhcp --device=link --activate --onboot=yes
network --hostname=localhost.localdomain

# Touch ONLY the 20 GB OS disk. sdb and sdc must stay pristine - they are the
# scratch disks for the swap (T08) and LVM (T15) tasks.
ignoredisk --only-use=sda
clearpart --all --initlabel --drives=sda
autopart --type=lvm
bootloader --boot-drive=sda

firstboot --disable
skipx
selinux --enforcing
firewall --enabled --service=ssh
services --enabled=sshd,crond,chronyd

# Install from the attached DVD
cdrom

%packages
@^minimal-environment
openssh-server
cronie
chrony
lvm2
tar
curl
vim-enhanced
bash-completion
policycoreutils-python-utils
%end

%post --log=/root/ks-post.log
# Allow root SSH so the host can push the task files in before T01 is done.
mkdir -p /etc/ssh/sshd_config.d
echo 'PermitRootLogin yes' > /etc/ssh/sshd_config.d/99-rhcsa-lab.conf

# Host's lab key, substituted in at ISO-build time by 02-install-os.ps1
mkdir -p /root/.ssh && chmod 700 /root/.ssh
echo '@@SSHKEY@@' > /root/.ssh/authorized_keys
chmod 600 /root/.ssh/authorized_keys

# Seed the source file for task T07 so it is ready to work on.
printf 'abcde one\nxxx\nabcde two\nyyy\nabcde three\n' > /etc/testfile
chmod 644 /etc/testfile

# Friendly login banner
cat > /etc/motd <<'EOF'

  RHCSA practice lab - node1
  ---------------------------
  Tasks   : cat /root/TASKS.md
  Grade   : sudo bash /root/grade.sh -v
  Answers : /root/ANSWERS.md  (only after you have tried!)

  Grade once, then REBOOT and grade again. The second run is the real score.

EOF
%end

# Power off rather than reboot: the install DVD is still attached (task T13 needs it)
# and a reboot would just re-launch the installer.
poweroff
