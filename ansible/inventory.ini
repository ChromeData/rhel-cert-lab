; Lab inventory.
; node1 is both the Ansible control node and a system under test.
; node2 is the second system — used to prove services answer from OUTSIDE localhost,
; which is where most exam points are actually lost.

[control]
node1 ansible_host=127.0.0.1 ansible_connection=local

[managed]
node2 ansible_host=192.168.56.102

[lab:children]
control
managed

[lab:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
