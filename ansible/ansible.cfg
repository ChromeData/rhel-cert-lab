[defaults]
inventory       = inventory.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
; No stdout_callback override: the 'yaml' callback ships in a collection, not in
; ansible-core, so setting it breaks on a stock RHEL install. Default works everywhere.

[privilege_escalation]
become      = True
become_method = sudo
become_user = root
become_ask_pass = False
