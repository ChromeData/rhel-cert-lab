<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>STUDY PLAN</title>
<style>
  :root{--bg:#080a08;--card:#0f130f;--line:#1e3a1e;--ink:#d6e0d6;--dim:#7d8a7d;
        --green:#4af626;--green2:#2fbf1a;--red:#ff4d4d;--amber:#ffb000;--lock:#3a3f3a;
        --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px;line-height:1.55;
       padding:env(safe-area-inset-top) 0 0}
  .wrap{max-width:680px;margin:0 auto;padding:14px 16px 110px}

  h1{font-size:18px;color:var(--green);letter-spacing:1.5px;margin:4px 0 2px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}

  /* progress */
  .prog{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:8px}
  .prog .top{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:8px}
  .prog .top b{color:var(--green);font-size:15px}
  .bar{height:10px;background:#0a0f0a;border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));width:0;
            transition:width .4s}
  .reset{width:100%;margin-top:10px;font:inherit;font-size:11px;padding:7px;background:#0c110c;
         color:var(--dim);border:1px solid var(--line);border-radius:6px;cursor:pointer;letter-spacing:1px}

  /* track */
  .track{position:relative;margin-top:20px;padding-left:34px}
  .track::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--line)}

  .lvl{position:relative;margin-bottom:12px}
  .dot{position:absolute;left:-34px;top:14px;width:32px;height:32px;border-radius:50%;
       border:2px solid var(--line);background:var(--bg);display:flex;align-items:center;
       justify-content:center;font-size:12px;font-weight:700;color:var(--lock);z-index:2}
  .lvl.cur .dot{border-color:var(--green);color:var(--green);box-shadow:0 0 12px rgba(74,246,38,.45)}
  .lvl.done .dot{border-color:var(--green2);background:var(--green2);color:#000}
  .lvl.done .dot::after{content:"✓";font-size:15px}
  .lvl.done .dot i{display:none}

  .box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer}
  .lvl.cur .box{border-color:var(--green2);box-shadow:0 0 16px rgba(74,246,38,.10)}
  .lvl.locked .box{opacity:.42}
  .ttl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .ttl h3{margin:0;font-size:15px;color:var(--ink);flex:1;min-width:150px}
  .lvl.cur .ttl h3{color:var(--green)}
  .lvl.done .ttl h3{color:var(--dim);text-decoration:line-through}
  .meta{font-size:11px;color:var(--dim);letter-spacing:.5px;white-space:nowrap}
  .meta b{color:var(--amber)}
  .flag{font-size:10px;letter-spacing:1px;color:var(--red);border:1px solid var(--red);
        padding:1px 6px;border-radius:3px}

  .body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
  .lvl.open .body{display:block}
  .body p{margin:0 0 10px}
  .body code{color:var(--amber);background:#0a0f0a;border:1px solid var(--line);padding:1px 5px;
             border-radius:3px;font-size:13px}
  .gate{border-left:3px solid var(--green2);background:#0a140a;padding:9px 12px;margin:12px 0 0}
  .gate span{display:block;font-size:10px;letter-spacing:1.5px;color:var(--green2);font-weight:700;margin-bottom:3px}
  .mark{width:100%;margin-top:12px;font:inherit;font-size:13px;font-weight:700;padding:12px;
        border:0;border-radius:6px;background:var(--green2);color:#000;cursor:pointer;letter-spacing:1px}
  .lvl.done .mark{background:#0c110c;color:var(--dim);border:1px solid var(--line)}

  .milestone{margin:22px 0 22px -34px;padding:12px 14px;border:1px dashed var(--green);
             border-radius:8px;background:#0a140a;text-align:center}
  .milestone b{color:var(--green);letter-spacing:1.5px;font-size:13px}
  .milestone i{display:block;color:var(--dim);font-style:normal;font-size:11.5px;margin-top:3px}

  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0c110c;
        border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
  .tabs a{flex:1;text-align:center;padding:15px 0;color:var(--dim);text-decoration:none;
          font-size:12px;letter-spacing:1.5px;font-weight:700}
  .tabs a.on{color:#000;background:var(--green2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>STUDY PLAN</h1>
  <div class="sub">Advance on the gate, not on the clock.</div>

  <div class="prog">
    <div class="top">
      <span>LEVEL <b id="curLvl">1</b> / 15</span>
      <span><b id="hrsDone">0</b> of 130 hrs</span>
    </div>
    <div class="bar"><span id="bar"></span></div>
    <button class="reset" id="reset">RESET PROGRESS</button>
  </div>

  <div class="track" id="track"></div>
</div>

<nav class="tabs">
  <a href="index.html">DRILL</a>
  <a href="plan.html" class="on">PLAN</a>
  <a href="card.html">CARD</a>
</nav>

<script>
const LEVELS=[
{n:1,t:"Orientation",h:3,r:"no reps",part:"RHCSA",
 d:"Boot the lab. Log into both nodes. Learn <code>lsblk</code>, <code>df -h</code>, <code>systemctl status</code>, <code>man -k</code>. Read the CARD once.",
 g:"You can move around the filesystem and read a service's status without help."},

{n:2,t:"Storage",h:14,r:"8 reps",part:"RHCSA",key:1,
 d:"Partitions, swap, LVM create / extend / shrink, fstab by UUID, ext4 vs xfs vs vfat.<br><br>First because it is the biggest block of points, everything else needs disks to exist, and a bad fstab line can cost you the whole machine — you want that reflex early.",
 g:"Build a VG + LV + filesystem + fstab entry from memory, reboot, it survives. Three times in a row, no notes."},

{n:3,t:"Services & firewall",h:10,r:"6 reps",part:"RHCSA",
 d:"httpd, vsftpd, nfs-server. <code>enable --now</code>. <code>firewall-cmd --permanent</code> then <code>--reload</code>. Always test from node2, never localhost.",
 g:"Install, enable and open a service, then prove it works from node2, in under 4 minutes."},

{n:4,t:"Users & permissions",h:8,r:"5 reps",part:"RHCSA",
 d:"useradd / groupadd, supplementary vs primary groups, password aging, setgid, sticky bit, ACLs, sudo.",
 g:"Read \"members of X can read and write, nobody else\" and produce the right mode without thinking."},

{n:5,t:"SELinux",h:7,r:"5 reps",part:"RHCSA",
 d:"Enforcing at boot, file contexts, <code>restorecon</code>, port labels with <code>semanage</code>, booleans with <code>setsebool -P</code>.<br><br>Here because it silently breaks the services you just learned.",
 g:"Given a 403 on a web page, find and fix the context in under 2 minutes."},

{n:6,t:"Boot, kernel, recovery",h:8,r:"6 reps",part:"RHCSA",key:1,
 d:"Root password recovery on <b>both</b> the RHEL 9 and RHEL 10 procedures. GRUB editing, <code>grubby</code>, boot targets, fstab recovery from emergency mode.<br><br>On the real exam the second machine's root password is not given to you. Fail this and every task on that machine is unreachable.",
 g:"Recover a root password cold, both procedures, no notes. Then break fstab deliberately and recover from emergency mode."},

{n:7,t:"Networking",h:6,r:"4 reps",part:"RHCSA",
 d:"<code>nmcli con mod</code>, secondary addresses, IPv6, hostname, <code>/etc/hosts</code>, DNS order.",
 g:"Static IP + gateway + DNS + hostname, persistent through a reboot, in 3 minutes."},

{n:8,t:"Scheduling, logs, time",h:6,r:"4 reps",part:"RHCSA",
 d:"cron, <code>at</code>, systemd timers, journald persistence, chrony, <code>tuned</code>.",
 g:"Write a cron line and a systemd timer for the same job, and explain when you'd use each."},

{n:9,t:"Shell scripting",h:8,r:"5 reps",part:"RHCSA",
 d:"<code>$1</code>, <code>if</code>/<code>test</code>, <code>for</code> loops, exit codes, reading command output.",
 g:"Write a script that takes an argument, validates it, and exits with the right code — from a blank file."},

{n:10,t:"Break / fix",h:6,r:"10 faults",part:"RHCSA",
 d:"<code>break-fix -l 3</code>. No hints. Diagnose, fix, <code>--check</code>, reboot, check again.<br><br>First level that mixes everything, and the closest thing to the real job.",
 g:"8 of 10 faults diagnosed without using <code>--reveal</code>."},

{n:11,t:"Full timed exams",h:8,r:"4 runs",part:"RHCSA",
 d:"34 tasks, 180 minutes, clean snapshot, no notes. Grade, reboot, grade again.",
 g:"Three consecutive runs above 85%. Not 70 — you want margin for exam nerves."},

{n:12,t:"Ansible fundamentals",h:10,r:"5 reps",part:"RHCE",
 d:"Install, <code>ansible.cfg</code>, inventory, ad-hoc commands, modules, idempotency.",
 g:"Explain why a second run should report <code>changed=0</code>, and write a task that wrongly doesn't."},

{n:13,t:"Playbooks",h:14,r:"8 reps",part:"RHCE",key:1,
 d:"Tasks, variables, facts, loops, conditionals, handlers, <code>register</code>, error handling.<br><br>Rewrite the RHCSA levels as playbooks — same outcome, written down instead of typed.",
 g:"Convert any RHCSA task into a working idempotent playbook in under 10 minutes."},

{n:14,t:"Roles, templates, vault",h:12,r:"6 reps",part:"RHCE",
 d:"Role structure, <code>ansible-galaxy init</code>, Jinja2 templates, vault, <code>when</code> and tags.",
 g:"Build a role from scratch that configures a service across hosts, with a templated config and an encrypted variable."},

{n:15,t:"Scale & timed EX294",h:18,r:"4 runs",part:"RHCE",
 d:"RHEL system roles, multi-host plays, <code>delegate_to</code>, <code>serial</code>. Then full timed runs.",
 g:"Three consecutive runs above 85%."},
];

const KEY="rhcsa-plan-v1";
let done={}; try{done=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(done));

function firstUndone(){ for(const l of LEVELS) if(!done[l.n]) return l.n; return LEVELS.length+1; }

function render(){
  const cur=firstUndone();
  let html="", lastPart=null;
  for(const l of LEVELS){
    if(l.part==="RHCE" && lastPart==="RHCSA"){
      const got=LEVELS.filter(x=>x.part==="RHCSA").every(x=>done[x.n]);
      html+=`<div class="milestone"><b>${got?"✅ ":""}RHCSA READY</b><i>hour 76 — do not start RHCE until this is passed</i></div>`;
    }
    lastPart=l.part;
    const st = done[l.n] ? "done" : (l.n===cur ? "cur" : (l.n<cur?"":"locked"));
    html+=`<div class="lvl ${st}" data-n="${l.n}">
      <div class="dot"><i>${l.n}</i></div>
      <div class="box">
        <div class="ttl">
          <h3>${l.t}</h3>
          ${l.key?'<span class="flag">HIGH LEVERAGE</span>':''}
          <span class="meta"><b>${l.h}h</b> · ${l.r}</span>
        </div>
        <div class="body">
          <p>${l.d}</p>
          <div class="gate"><span>GATE TO PASS</span>${l.g}</div>
          <button class="mark">${done[l.n]?"✓ COMPLETED — tap to undo":"MARK LEVEL COMPLETE"}</button>
        </div>
      </div>
    </div>`;
  }
  const allDone=LEVELS.every(x=>done[x.n]);
  html+=`<div class="milestone"><b>${allDone?"✅ ":""}RHCE READY</b><i>hour 130</i></div>`;
  document.getElementById("track").innerHTML=html;

  const hrs=LEVELS.filter(l=>done[l.n]).reduce((a,l)=>a+l.h,0);
  const tot=LEVELS.reduce((a,l)=>a+l.h,0);
  document.getElementById("hrsDone").textContent=hrs;
  document.getElementById("curLvl").textContent=Math.min(cur,15);
  document.getElementById("bar").style.width=(hrs/tot*100)+"%";
}

document.getElementById("track").addEventListener("click",e=>{
  const lvl=e.target.closest(".lvl"); if(!lvl)return;
  const n=+lvl.dataset.n;
  if(e.target.closest(".mark")){ done[n]=!done[n]; save(); render(); return; }
  lvl.classList.toggle("open");
});
document.getElementById("reset").onclick=()=>{
  if(confirm("Clear all level progress?")){ done={}; save(); render(); }
};
render();
</script>
</body>
</html>
